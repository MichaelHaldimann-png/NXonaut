<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">NXonaut</title>
  <desc id="d">A simple wireframe part in orbit on a dark night sky, next to the name NXonaut.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#sky)"/>
  <g fill="#e6ecff">
    <circle cx="80" cy="50" r="1.2" opacity=".7"/><circle cx="190" cy="230" r="1" opacity=".5"/>
    <circle cx="310" cy="70" r="1.4" opacity=".8"/><circle cx="460" cy="250" r="1" opacity=".5"/>
    <circle cx="540" cy="40" r="1.1" opacity=".6"/><circle cx="700" cy="270" r="1.3" opacity=".6"/>
    <circle cx="820" cy="60" r="1" opacity=".5"/><circle cx="960" cy="240" r="1.2" opacity=".7"/>
    <circle cx="1080" cy="40" r="1.4" opacity=".8"/><circle cx="1140" cy="190" r="1" opacity=".5"/>
    <circle cx="640" cy="120" r=".9" opacity=".4"/><circle cx="1010" cy="130" r=".9" opacity=".4"/>
  </g>
