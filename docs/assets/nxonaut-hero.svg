<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">NXonaut</title>
  <desc id="d">A small astronaut holding a wireframe part, floating on a dark night sky, next to the name NXonaut.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#sky)"/>
  <g fill="#e6ecff">
    <circle cx="80" cy="50" r="1.2" opacity=".7"/><circle cx="190" cy="230" r="1" opacity=".5"/>
    <circle cx="310" cy="70" r="1.4" opacity=".8"/><circle cx="460" cy="250" r="1" opacity=".5"/>
    <circle cx="540" cy="40" r="1.1" opacity=".6"/><circle cx="700" cy="270" r="1.3" opacity=".6"/>
    <circle cx="820" cy="60" r="1" opacity=".5"/><circle cx="960" cy="240" r="1.2" opacity=".7"/>
    <circle cx="1080" cy="40" r="1.4" opacity=".8"/><circle cx="1140" cy="190" r="1" opacity=".5"/>
    <circle cx="640" cy="120" r=".9" opacity=".4"/><circle cx="1010" cy="130" r=".9" opacity=".4"/>
  </g>
  <g transform="translate(230 150)">
    <ellipse rx="135" ry="40" fill="none" stroke="#5b6b9a" stroke-width="1.2" transform="rotate(-14)" stroke-dasharray="3 6"/>
    <circle cx="122" cy="-42" r="4.5" fill="#ffd27a"/>
    <g transform="rotate(-12) scale(0.95)">
<g id="astronaut" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- backpack -->
  <rect x="-30" y="-6" width="60" height="52" rx="12" fill="#c9d3ef" stroke="#2a3557" stroke-width="3"/>
  <!-- body -->
  <rect x="-24" y="2" width="48" height="50" rx="16" fill="#eef2ff" stroke="#2a3557" stroke-width="3"/>
  <!-- chest panel -->
  <rect x="-11" y="16" width="22" height="13" rx="3" fill="#9fb4ff" stroke="#2a3557" stroke-width="2"/>
  <!-- legs -->
  <path d="M-13 50 L-16 72 M13 50 L18 70" stroke="#2a3557" stroke-width="16"/>
  <path d="M-13 50 L-16 72 M13 50 L18 70" stroke="#eef2ff" stroke-width="10"/>
  <!-- left arm waving -->
  <path d="M-22 12 L-40 -6" stroke="#2a3557" stroke-width="15"/>
  <path d="M-22 12 L-40 -6" stroke="#eef2ff" stroke-width="9"/>
  <!-- right arm holding cube -->
  <path d="M22 14 L42 26" stroke="#2a3557" stroke-width="15"/>
  <path d="M22 14 L42 26" stroke="#eef2ff" stroke-width="9"/>
  <!-- helmet -->
  <circle cx="0" cy="-22" r="27" fill="#eef2ff" stroke="#2a3557" stroke-width="3"/>
  <rect x="-18" y="-35" width="36" height="25" rx="12" fill="#1b2546" stroke="#2a3557" stroke-width="2.5"/>
  <path d="M-10 -29 Q-4 -33 4 -31" stroke="#9fb4ff" stroke-width="2.5"/>
  <!-- cube in hand -->
  <g transform="translate(58 30) scale(0.42)" stroke="#9fb4ff" stroke-width="6">
    <path d="M-40 -18 L0 -40 L40 -18 L40 26 L0 48 L-40 26 Z" fill="#0b1020"/>
    <path d="M-40 -18 L0 4 L40 -18 M0 4 L0 48"/>
  </g>
</g>
    </g>
  </g>
  <text x="430" y="150" fill="#f1f4ff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="1">NXonaut</text>
  <text x="432" y="192" fill="#a9b4d6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">AI agents model, inspect and export in Siemens NX</text>
  <text x="432" y="224" fill="#6f7ba3" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Community MCP server · not affiliated with Siemens</text>
</svg>
